<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Re:Swing 動画ライブラリ</title>
<meta name="description" content="Re:Swing の構え方編・スイング編・ドリル集をまとめた動画一覧">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: clubhouse-style dark library — serif masthead, quiet course index, then one gallery per course with 16:9 framed thumbnails; clicking opens a cinema sheet with the course playlist beside it. Single deliberate dark theme. */
:root{
  color-scheme:dark;
  --bg:#0b0f0d; --bg-2:#101613; --surface:#141b17; --surface-2:#1b241f;
  --fg:#ece6d8; --muted:#9a9a8c; --faint:#5f6359; --line:rgba(201,169,110,.18); --line-strong:rgba(201,169,110,.42);
  --gold:#c9a96e; --gold-hi:#e6cf9c; --gold-lo:#8a6f3e; --on-gold:#14110a;
  --scrim:rgba(4,6,5,.86);
  --kamae-a:#0f2a1e; --kamae-b:#1d4a35;
  --swing-a:#101f2c; --swing-b:#1f3d55;
  --drill-a:#2a1c10; --drill-b:#4f3518;
  --font-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-latin:"Cormorant Garamond","Shippori Mincho",Georgia,serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --radius:4px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%,rgba(201,169,110,.07),transparent 60%),radial-gradient(900px 500px at -10% 20%,rgba(29,74,53,.18),transparent 60%);background-attachment:fixed}
button{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
::selection{background:var(--gold);color:var(--on-gold)}
.wrap{max-width:1320px;margin:0 auto;padding-inline:clamp(16px,4vw,48px)}
.eyebrow{font-family:var(--font-latin);font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}

/* masthead */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(11,15,13,.82);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:20px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0;margin-right:auto}
.mark{width:38px;height:38px;flex:none;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-family:var(--font-latin);font-style:italic;font-size:19px;font-weight:600}
.brand h1{margin:0;font-family:var(--font-latin);font-weight:600;font-size:24px;letter-spacing:.04em;line-height:1.1;white-space:nowrap}
.brand small{display:block;font-family:var(--font-latin);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:500}
.search{flex:1 1 300px;max-width:440px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line-strong);padding:0 2px;height:40px}
.search:focus-within{border-color:var(--gold)}
.search svg{color:var(--gold);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:14px;color:var(--fg);outline:none;height:100%;letter-spacing:.02em}
.search input::placeholder{color:var(--faint)}
.search .clear{border:0;background:transparent;color:var(--muted);width:28px;height:28px;cursor:pointer}
.chips{display:flex;gap:28px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:transparent;padding:10px 0 12px;font-size:14px;letter-spacing:.08em;cursor:pointer;color:var(--muted);border-bottom:1px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:baseline}
.chip span{font-family:var(--font-latin);font-size:14px;color:var(--faint);font-variant-numeric:lining-nums tabular-nums}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{color:var(--gold-hi);border-bottom-color:var(--gold)}
.chip[aria-pressed="true"] span{color:var(--gold)}

/* hero */
.hero{padding-block:clamp(40px,7vw,80px) 28px;display:grid;gap:14px}
.hero h2{margin:0;font-family:var(--font-display);font-weight:600;font-size:clamp(28px,4.6vw,52px);line-height:1.25;letter-spacing:.06em;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:40em;font-size:14.5px;letter-spacing:.04em}
.rule{display:flex;align-items:center;gap:14px;color:var(--gold);margin-top:6px}
.rule::before,.rule::after{content:"";height:1px;background:linear-gradient(90deg,transparent,var(--line-strong));flex:1;max-width:120px}
.rule::after{background:linear-gradient(90deg,var(--line-strong),transparent)}
.rule::before{display:none}

/* course index */
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ov{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;background:transparent;border:0;padding:22px 20px;cursor:pointer;text-align:left;transition:background .3s}
.ov+.ov{border-left:1px solid var(--line)}
@media (max-width:820px){.ov+.ov{border-left:0;border-top:1px solid var(--line)}}
.ov:hover{background:rgba(201,169,110,.04)}
.ov-num{font-family:var(--font-latin);font-size:44px;line-height:1;color:var(--gold);font-weight:500;font-variant-numeric:lining-nums}
.ov-body{min-width:0}
.ov-title{display:block;font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.08em}
.ov-sub{display:block;font-size:12px;color:var(--muted);letter-spacing:.03em;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:block;height:1px;background:var(--line);margin-top:10px}
.bar i{display:block;height:1px;background:var(--gold);transition:width .5s;box-shadow:0 0 6px rgba(201,169,110,.6)}

/* sections */
main{padding-block:12px 80px}
.sec{padding-top:clamp(48px,6vw,72px)}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;align-items:end;margin-bottom:26px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.sec-head .eyebrow{grid-column:1/-1}
.sec-head h2{font-family:var(--font-display);font-weight:600;font-size:clamp(24px,3vw,32px);letter-spacing:.1em;margin:0;line-height:1.3}
.sec-head .count{color:var(--muted);font-size:12.5px;letter-spacing:.06em;font-variant-numeric:tabular-nums;text-align:right}
.sec-head p{grid-column:1/-1;margin:0;color:var(--muted);font-size:13.5px;letter-spacing:.03em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:40px 24px}
.empty{padding:72px 0;text-align:center;color:var(--muted);font-family:var(--font-display);letter-spacing:.08em}

/* card */
.card{display:flex;flex-direction:column;gap:14px;min-width:0}
.thumb{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:16/9;border:0;padding:0;border-radius:var(--radius);overflow:hidden;cursor:pointer;background:var(--surface);box-shadow:0 18px 40px -22px rgba(0,0,0,.9)}
.thumb::before{content:"";position:absolute;inset:0;z-index:3;border:1px solid var(--line);border-radius:inherit;pointer-events:none;transition:border-color .35s}
.thumb:hover::before,.thumb:focus-visible::before{border-color:var(--gold)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s,transform .8s cubic-bezier(.2,.7,.2,1);filter:saturate(.92) contrast(1.04)}
.thumb.has-img img{opacity:1}
.thumb.has-img::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.55));pointer-events:none}
.thumb:hover img{transform:scale(1.04)}
.badge{position:absolute;right:10px;bottom:9px;z-index:4;color:var(--gold-hi);font-family:var(--font-latin);font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.seen-flag{position:absolute;left:10px;top:10px;z-index:4;font-size:10.5px;letter-spacing:.14em;color:var(--on-gold);background:var(--gold);padding:2px 8px;border-radius:2px;font-weight:700}
.play{position:absolute;inset:0;display:grid;place-items:center;z-index:2;opacity:0;transition:opacity .35s;background:rgba(0,0,0,.28)}
.play i{width:58px;height:58px;border-radius:50%;border:1px solid var(--gold-hi);display:grid;place-items:center;background:rgba(11,15,13,.45);backdrop-filter:blur(4px)}
.play i::after{content:"";border-style:solid;border-width:9px 0 9px 15px;border-color:transparent transparent transparent var(--gold-hi);margin-left:4px}
.thumb:hover .play,.thumb:focus-visible .play{opacity:1}

/* crafted tile — shown whenever there is no photo */
.tile{position:absolute;inset:0;color:var(--fg);padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;overflow:hidden}
.tile[data-sec="kamae"]{background:radial-gradient(120% 140% at 100% 0%,var(--kamae-b),var(--kamae-a) 60%,#07100b)}
.tile[data-sec="swing"]{background:radial-gradient(120% 140% at 100% 0%,var(--swing-b),var(--swing-a) 60%,#070c11)}
.tile[data-sec="drill"]{background:radial-gradient(120% 140% at 100% 0%,var(--drill-b),var(--drill-a) 60%,#110b06)}
.tile::before{content:"";position:absolute;inset:7px;border:1px solid rgba(201,169,110,.28);pointer-events:none}
.tile::after{content:"";position:absolute;right:-12%;bottom:-38%;width:62%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(201,169,110,.16);box-shadow:0 0 0 18px rgba(201,169,110,.035)}
.tile-sec{position:relative;font-family:var(--font-latin);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);padding:2px 4px}
.tile-num{position:relative;font-family:var(--font-latin);font-weight:500;font-size:clamp(46px,7vw,64px);line-height:.9;color:var(--gold-hi);padding-left:4px;font-variant-numeric:lining-nums}
.tile-title{position:relative;font-family:var(--font-display);font-weight:600;font-size:15px;line-height:1.45;max-width:88%;text-wrap:balance;letter-spacing:.06em;padding:0 4px 2px}
.tile-mid{display:flex;align-items:flex-end;gap:12px}

.info{display:flex;gap:12px;align-items:flex-start}
.info-text{min-width:0;flex:1}
.step{display:block;font-family:var(--font-latin);font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.info h3{font-family:var(--font-display);font-size:16.5px;font-weight:600;line-height:1.5;letter-spacing:.05em;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;transition:color .25s}
.info h3:hover{color:var(--gold-hi)}
.info .sub{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.04em}
.watch{flex:none;margin-top:18px;border:1px solid var(--line-strong);background:transparent;color:var(--muted);border-radius:2px;font-size:11.5px;letter-spacing:.08em;padding:4px 10px;cursor:pointer;white-space:nowrap;transition:all .25s}
.watch:hover{border-color:var(--gold);color:var(--gold-hi)}
.watch[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:700}

/* cinema sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 28px) 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
.panel{background:var(--bg-2);border:1px solid var(--line);border-radius:6px;width:100%;max-width:1200px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;padding:22px;position:relative;box-shadow:0 40px 120px -30px rgba(0,0,0,.9)}
@media (max-width:900px){.panel{grid-template-columns:minmax(0,1fr);padding:14px;gap:20px}}
.stage{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;border-radius:var(--radius);overflow:hidden;background:#000;border:1px solid var(--line)}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.stage .tile{padding:22px 26px}
.stage .tile::before{inset:12px}
.stage .tile-num{font-size:clamp(64px,11vw,120px)}
.stage .tile-title{font-size:clamp(18px,2.4vw,26px)}
.stage .tile-sec{font-size:12px}
.stage-cta{position:absolute;inset:0;display:grid;place-items:center;z-index:5;background:rgba(0,0,0,.18)}
.stage img.still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.open-btn{display:inline-flex;align-items:center;gap:12px;background:var(--gold);color:var(--on-gold);text-decoration:none;font-weight:700;letter-spacing:.1em;font-size:14px;padding:14px 26px;border-radius:2px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:background .25s}
.open-btn:hover{background:var(--gold-hi)}
.open-btn::before{content:"";border-style:solid;border-width:6px 0 6px 10px;border-color:transparent transparent transparent currentColor}
.now .step{margin-top:20px}
.now h2{font-family:var(--font-display);font-weight:600;font-size:clamp(20px,2.4vw,26px);letter-spacing:.06em;margin:0 0 6px;line-height:1.45;text-wrap:balance}
.now-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:13px;letter-spacing:.04em}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:transparent;color:var(--fg);border-radius:2px;padding:9px 16px;font-size:13px;letter-spacing:.08em;cursor:pointer;text-decoration:none;transition:all .25s}
.btn:hover{border-color:var(--gold);color:var(--gold-hi)}
.btn:disabled{opacity:.3;cursor:default}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:700}
.btn.primary:hover{background:var(--gold-hi);color:var(--on-gold)}
.btn[aria-pressed="true"]{color:var(--gold-hi);border-color:var(--gold)}
.close{position:absolute;top:-16px;right:-16px;width:40px;height:40px;border-radius:50%;border:1px solid var(--gold);background:var(--bg-2);color:var(--gold-hi);cursor:pointer;font-size:20px;line-height:1;z-index:6}
@media (max-width:640px){.close{top:6px;right:6px}}
.upnext h3{margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.upnext h3 .eyebrow{display:block;font-size:11px}
.upnext h3 b{font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:.08em}
.upnext ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:min(68vh,640px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--gold-lo) transparent}
.un{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;align-items:center;border:0;background:transparent;text-align:left;padding:6px;border-radius:3px;cursor:pointer;width:100%;transition:background .25s}
.un:hover{background:rgba(201,169,110,.06)}
.un[aria-current="true"]{background:rgba(201,169,110,.1)}
.un[aria-current="true"] .un-t{color:var(--gold-hi)}
.un .thumb{box-shadow:none}
.un .tile{padding:6px 8px}
.un .tile::before{inset:4px}
.un .tile-num{font-size:30px}
.un .tile-title,.un .tile-sec,.un .badge,.un .seen-flag{display:none}
.un-t{display:block;font-family:var(--font-display);font-size:13.5px;font-weight:600;line-height:1.45;letter-spacing:.04em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.un-s{display:block;font-family:var(--font-latin);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-top:2px}
footer{color:var(--faint);font-size:12px;letter-spacing:.04em;padding-block:28px 48px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer .eyebrow{font-size:11px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <div class="mark" aria-hidden="true">R</div>
        <h1>Re:Swing<small>Video Library</small></h1>
      </div>
      <label class="search" for="q">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.5"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="レッスンを探す　グリップ・前傾・素振り" autocomplete="off">
        <button class="clear" id="clear" type="button" aria-label="検索をクリア" hidden>✕</button>
      </label>
    </div>
    <nav class="chips" id="chips" aria-label="カテゴリ"></nav>
  </div>
</header>

<div class="wrap">
  <section class="hero">
    <div class="eyebrow">Members Lesson Archive</div>
    <h2>構えから、振り切るまで。</h2>
    <p>Re:Swing のレッスン動画を、構え方編・スイング編・ドリル集の順にまとめました。STEP の順に見ると、ひとつずつ積み上がるように組んであります。</p>
  </section>
  <section class="overview" id="overview" aria-label="コースごとの視聴状況"></section>
  <main id="main"></main>
  <footer><span class="eyebrow">Re:Swing Golf Lesson</span><span>動画を開くと「視聴済み」になります。視聴記録はこのブラウザにだけ保存されます。</span></footer>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="now-title">
  <div class="panel">
    <button class="close" id="close" type="button" aria-label="閉じる">×</button>
    <div class="now">
      <div class="stage" id="stage"></div>
      <span class="step" id="now-step"></span>
      <h2 id="now-title"></h2>
      <div class="now-meta" id="now-meta"></div>
      <div class="actions">
        <button class="btn" id="prev" type="button">← 前の動画</button>
        <button class="btn primary" id="next" type="button">次の動画 →</button>
        <button class="btn" id="now-watch" type="button" aria-pressed="false">視聴済みにする</button>
        <a class="btn" id="ext" href="#" target="_blank" rel="noopener">別タブで開く ↗</a>
      </div>
    </div>
    <aside class="upnext">
      <h3><span class="eyebrow">Playlist</span><b id="upnext-title">このコースの動画</b></h3>
      <ol id="upnext"></ol>
    </aside>
  </div>
</div>

<script>
const SECTIONS = [
  { key: 'kamae', name: '構え方編', en: 'Course I — Address', desc: 'アドレス、グリップ、前傾。ボールに当たる構えをつくる基礎の7本。' },
  { key: 'swing', name: 'スイング編', en: 'Course II — Swing', desc: 'クラブの扱い方からフォロー、フィニッシュまで。スイングの流れを順に9本。' },
  { key: 'drill', name: 'ドリル集', en: 'Course III — Drills', desc: 'レッスンで学んだ動きを、自主練で体に覚えさせるための18本。' },
];
const yt = (sec, step, title, id) => ({ sec, step, title, src: 'yt', id });
const gd = (sec, step, title, id) => ({ sec, step, title, src: 'gd', id });
const VIDEOS = [
  yt('kamae', 1, '当たる正しいアドレス', 'vf-HaatPbw4'),
  yt('kamae', 2, '正しい握り方【前編】', 'ol44-t-FkXQ'),
  yt('kamae', 3, '正しい握り方【後編】', 'ZqpIKE7fkqQ'),
  yt('kamae', 4, '正しい前傾の仕方', '7cn3cTPYoqY'),
  yt('kamae', 5, '肩甲骨をハメる', 'xzWok5Efq54'),
  yt('kamae', 6, 'フェース面の向け方', 'prQ0Kb_ogNs'),
  yt('kamae', 7, '細かいチェックポイント', 'dvPqGWbsE4o'),
  yt('swing', 8, '正しいクラブの扱い方', 'P4mLVNtD7T8'),
  yt('swing', 9, 'クラブを邪魔しない超基本', 'OWwzlvDoDEc'),
  yt('swing', 10, '狙った場所に飛ばすコントロール', 'OcWtRsC2HL8'),
  yt('swing', 11, 'ボールの当て方の基本', 'tuwsJRglkjo'),
  yt('swing', 12, 'クラブを邪魔しないバックスイングのやり方', '1Y97llf3J00'),
  yt('swing', 13, '最大円弧', '8JTTJMkjI7c'),
  yt('swing', 14, '加速装置としての右手の役割', 'Ob_E8zNECOU'),
  yt('swing', 15, '正しいフォローフィニッシュの作り方', 'yhJHUW5BQbM'),
  yt('swing', 16, '最後の砦 連続素振り', 'SvaQj07ddQM'),
  gd('drill', 1, 'グリップ【前編】', '1Sa1AL-o50Dk8AgMb8--m222OK_B-Vp7z'),
  gd('drill', 1, 'グリップ【後編】', '1tMRcUFHQDE2YZKw9o-YgIOGVKbwIkGXE'),
  gd('drill', 2, '正しい前傾の作り方', '1XngY86T-6IYDL8P91_eMU155UWryeS7i'),
  gd('drill', 3, '肩甲骨をハメる', '1mFd_1XaU19vwJ-4ntMxFD025JE21Ty7w'),
  gd('drill', 4, 'フェースの向き', '12cwyoUYVIYn8ngafNO4Te9miCPzoS1wn'),
  gd('drill', 5, '両足のデザイン', '1J_t7Ar5cwpxUGSjTBy3bUoiWz0UT_7H7'),
  gd('drill', 6, '腰の位置', '157OijUxZnZDaz4PlFO3nscMWXl3ihbei'),
  gd('drill', 7, '膝の向き', '1OcCEU7TBY4bXtBTQAfj0GJd_f9WORNng'),
  gd('drill', 8, '振り子キャッチ', '1hiXCnL0GIXR7XuF0Sr9cKx0dRxJSGObY'),
  gd('drill', 9, '一回転ドリル', '1zMpREltkYaLK3WxHg30WHtT6rbujIPhq'),
  gd('drill', 10, 'つまむ連続素振り', '1fZHOhyJMvbrTfSYAutQvkzwDA46mqL_H'),
  gd('drill', 11, '一回転叩きドリル', '1HX6rA5KbbOIIUuMfTDw4D80xfV6GvisT'),
  gd('drill', 12, 'テコの原理ドリル', '1j21RJNhzAyI--6wWfnuZWhiZcJwrkCVc'),
  gd('drill', 13, '大の字練習', '1RhuJO8MgO36i6d_ukQS0vTD_ZfC_oAGa'),
  gd('drill', 14, '右手を叩くドリル', '1JIamnAmLnwo0m8KmZwQo3eAKaDfECNe7'),
  gd('drill', 15, '左手一本練習', '1um0O8oTKPQ_hAy10ItfigynS3b_0iNY2'),
  gd('drill', 16, '歌舞伎ドリル', '1YT9WhGEinKYS3EyVRA4SQtPr6DgTQIok'),
  gd('drill', 17, '連続素振り', '19V1NIh4EzTXffYyNkz2kO8zMewLnUUgV'),
].map((v, i) => ({ ...v, idx: i, key: v.src + ':' + v.id }));

const secOf = k => SECTIONS.find(s => s.key === k);
const THUMBS = {}; /*THUMBS*/
const thumbUrl = v => THUMBS[v.id] || (v.src === 'yt' ? `https://i.ytimg.com/vi/${v.id}/hqdefault.jpg` : `https://drive.google.com/thumbnail?id=${v.id}&sz=w640`);
const watchUrl = v => v.src === 'yt' ? `https://www.youtube.com/watch?v=${v.id}` : `https://drive.google.com/file/d/${v.id}/view`;
const embedUrl = v => v.src === 'yt' ? `https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0&playsinline=1` : `https://drive.google.com/file/d/${v.id}/preview`;
const srcLabel = v => v.src === 'yt' ? 'YouTube' : 'Drive';
const stepLabel = v => v.sec === 'drill' ? `Drill ${pad(v.step)}` : `Lesson ${pad(v.step)}`;
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => s.normalize('NFKC').toLowerCase().replace(/[\s【】・]/g, '');

// 外部の画像が読み込めた環境なら、動画もページ内で再生できるとみなす
let canEmbed = false;

// 視聴記録 (このブラウザだけ)
const STORE = 'reswing-watched-v1';
let watched = new Set();
try { watched = new Set(JSON.parse(localStorage.getItem(STORE) || '[]')); } catch (e) {}
const saveWatched = () => { try { localStorage.setItem(STORE, JSON.stringify([...watched])); } catch (e) {} };

let filter = 'all';
let query = '';
const VALID = ['all', ...SECTIONS.map(s => s.key)];
const fromHash = location.hash.slice(1);
if (VALID.includes(fromHash)) filter = fromHash;
else { try { const f = localStorage.getItem('reswing-filter'); if (VALID.includes(f)) filter = f; } catch (e) {} }

function tileHTML(v) {
  const s = secOf(v.sec);
  return `<div class="tile" data-sec="${v.sec}">
    <div class="tile-sec">${esc(s.en.split(' — ')[1])}</div>
    <div class="tile-mid"><div class="tile-num">${pad(v.step)}</div></div>
    <div class="tile-title">${esc(v.title)}</div>
  </div>`;
}
function thumbHTML(v, extraClass = '') {
  return `${tileHTML(v)}
    <img src="${thumbUrl(v)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-thumb>
    <span class="play" aria-hidden="true"><i></i></span>
    <span class="badge">${srcLabel(v)}</span>
    ${watched.has(v.key) ? '<span class="seen-flag">視聴済み</span>' : ''}`;
}
function wireThumbs(root) {
  root.querySelectorAll('img[data-thumb]').forEach(img => {
    const box = img.parentElement;
    const ok = () => {
      // Drive は未公開ファイルだと小さなアイコンを返すので実サイズで判定
      if (img.naturalWidth < 120) return bad();
      box.classList.add('has-img');
      if (!img.src.startsWith('data:')) canEmbed = true;
    };
    const bad = () => img.remove();
    if (img.complete && img.naturalWidth) ok(); else { img.addEventListener('load', ok, { once: true }); img.addEventListener('error', bad, { once: true }); }
  });
}

function matches(v) {
  if (filter !== 'all' && v.sec !== filter) return false;
  if (!query) return true;
  const q = norm(query);
  return norm(v.title + secOf(v.sec).name + stepLabel(v) + srcLabel(v)).includes(q);
}

function renderChips() {
  const chips = [{ key: 'all', name: 'すべて', n: VIDEOS.length }, ...SECTIONS.map(s => ({ key: s.key, name: s.name, n: VIDEOS.filter(v => v.sec === s.key).length }))];
  document.getElementById('chips').innerHTML = chips.map(c =>
    `<button class="chip" type="button" data-filter="${c.key}" aria-pressed="${filter === c.key}">${esc(c.name)}<span>${c.n}</span></button>`).join('');
}
function renderOverview() {
  document.getElementById('overview').innerHTML = SECTIONS.map(s => {
    const list = VIDEOS.filter(v => v.sec === s.key);
    const done = list.filter(v => watched.has(v.key)).length;
    const next = list.find(v => !watched.has(v.key));
    return `<button class="ov" type="button" data-filter="${s.key}">
      <span class="ov-num">${pad(list.length)}</span>
      <span class="ov-body">
        <span class="ov-title">${esc(s.name)}</span>
        <span class="ov-sub">${done} / ${list.length} 本 視聴済み${next ? ` ・ 次は「${esc(next.title)}」` : ' ・ すべて視聴済み'}</span>
        <span class="bar"><i style="width:${list.length ? done / list.length * 100 : 0}%"></i></span>
      </span>
    </button>`;
  }).join('');
}
function cardHTML(v) {
  const on = watched.has(v.key);
  return `<article class="card">
    <button class="thumb" type="button" data-open="${v.idx}" aria-label="${esc(v.title)} を再生">${thumbHTML(v)}</button>
    <div class="info">
      <div class="info-text">
        <span class="step">${stepLabel(v)}</span>
        <h3 data-open="${v.idx}">${esc(v.title)}</h3>
        <div class="sub">${esc(secOf(v.sec).name)} ・ ${srcLabel(v)}</div>
      </div>
      <button class="watch" type="button" data-watch="${v.idx}" aria-pressed="${on}">${on ? '✓ 視聴済み' : '未視聴'}</button>
    </div>
  </article>`;
}
function renderMain() {
  const main = document.getElementById('main');
  const secs = SECTIONS.filter(s => filter === 'all' || s.key === filter);
  let html = '';
  for (const s of secs) {
    const list = VIDEOS.filter(v => v.sec === s.key && matches(v));
    if (!list.length) continue;
    const all = VIDEOS.filter(v => v.sec === s.key);
    const done = all.filter(v => watched.has(v.key)).length;
    html += `<section class="sec" id="sec-${s.key}">
      <div class="sec-head"><span class="eyebrow">${esc(s.en)}</span><h2>${esc(s.name)}</h2><span class="count">${query ? `${list.length} 件` : `全${all.length}本 ／ 視聴済み ${done}本`}</span><p>${esc(s.desc)}</p></div>
      <div class="grid">${list.map(cardHTML).join('')}</div>
    </section>`;
  }
  main.innerHTML = html || `<div class="empty">「${esc(query)}」に一致する動画はありません。別の言葉で検索してください。</div>`;
  wireThumbs(main);
}
function renderAll() { renderChips(); renderOverview(); renderMain(); }

function setFilter(f) {
  filter = f;
  try { localStorage.setItem('reswing-filter', f); } catch (e) {}
  history.replaceState(null, '', f === 'all' ? location.pathname + location.search : '#' + f);
  renderAll();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function toggleWatched(v, force) {
  const on = force ?? !watched.has(v.key);
  on ? watched.add(v.key) : watched.delete(v.key);
  saveWatched();
}

document.addEventListener('click', e => {
  const f = e.target.closest('[data-filter]');
  if (f) return setFilter(f.dataset.filter);
  const o = e.target.closest('[data-open]');
  if (o) return openPlayer(+o.dataset.open);
  const w = e.target.closest('[data-watch]');
  if (w) { toggleWatched(VIDEOS[+w.dataset.watch]); renderOverview(); renderMain(); }
});
const q = document.getElementById('q'), clearBtn = document.getElementById('clear');
q.addEventListener('input', () => { query = q.value.trim(); clearBtn.hidden = !q.value; renderMain(); });
clearBtn.addEventListener('click', () => { q.value = ''; query = ''; clearBtn.hidden = true; renderMain(); q.focus(); });

// ---- player ----
const sheet = document.getElementById('sheet');
let current = -1, lastFocus = null;
function openPlayer(i) {
  if (current < 0) lastFocus = document.activeElement;
  current = i;
  const v = VIDEOS[i], s = secOf(v.sec);
  toggleWatched(v, true);
  const stage = document.getElementById('stage');
  if (canEmbed) {
    stage.innerHTML = `<iframe src="${embedUrl(v)}" title="${esc(v.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  } else {
    stage.innerHTML = `${tileHTML(v)}${THUMBS[v.id] ? `<img class="still" src="${THUMBS[v.id]}" alt="">` : ''}<div class="stage-cta"><a class="open-btn" href="${watchUrl(v)}" target="_blank" rel="noopener">${v.src === 'yt' ? 'YouTube' : 'Googleドライブ'}で再生する</a></div>`;
  }
  document.getElementById('now-title').textContent = v.title;
  document.getElementById('now-meta').innerHTML = `<span>${esc(s.name)}</span><span>・</span><span>${v.src === 'yt' ? 'YouTube' : 'Googleドライブ'}</span>`;
  document.getElementById('now-step').textContent = stepLabel(v);
  document.getElementById('ext').href = watchUrl(v);
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').disabled = i === VIDEOS.length - 1;
  const nw = document.getElementById('now-watch');
  nw.setAttribute('aria-pressed', 'true'); nw.textContent = '✓ 視聴済み';
  document.getElementById('upnext-title').textContent = `${s.name}　全${VIDEOS.filter(x => x.sec === v.sec).length}本`;
  const ol = document.getElementById('upnext');
  ol.innerHTML = VIDEOS.filter(x => x.sec === v.sec).map(x => `<li><button class="un" type="button" data-open="${x.idx}" ${x.idx === i ? 'aria-current="true"' : ''}>
      <span class="thumb">${thumbHTML(x)}</span>
      <span><span class="un-t">${esc(x.title)}</span><span class="un-s">${stepLabel(x)}${watched.has(x.key) ? ' · Watched' : ''}</span></span>
    </button></li>`).join('');
  wireThumbs(ol);
  sheet.hidden = false;
  document.body.style.overflow = 'hidden';
  ol.querySelector('[aria-current]')?.scrollIntoView({ block: 'nearest' });
  document.getElementById('close').focus({ preventScroll: true });
  renderOverview(); renderMain();
}
function closePlayer() {
  sheet.hidden = true; current = -1;
  document.getElementById('stage').innerHTML = '';
  document.body.style.overflow = '';
  lastFocus?.focus?.({ preventScroll: true });
}
document.getElementById('close').addEventListener('click', closePlayer);
sheet.addEventListener('click', e => { if (e.target === sheet) closePlayer(); });
document.getElementById('prev').addEventListener('click', () => current > 0 && openPlayer(current - 1));
document.getElementById('next').addEventListener('click', () => current < VIDEOS.length - 1 && openPlayer(current + 1));
document.getElementById('now-watch').addEventListener('click', e => {
  const v = VIDEOS[current]; toggleWatched(v);
  const on = watched.has(v.key);
  e.currentTarget.setAttribute('aria-pressed', on); e.currentTarget.textContent = on ? '✓ 視聴済み' : '視聴済みにする';
  renderOverview(); renderMain();
});
document.addEventListener('keydown', e => {
  if (sheet.hidden) { if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); } return; }
  if (e.key === 'Escape') closePlayer();
});

renderAll();
</script>
